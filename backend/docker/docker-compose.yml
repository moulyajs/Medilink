services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile

    container_name: medilink-docling

    env_file:
      - ../.env

    volumes:
      - ..:/app

    depends_on:
      - minio
      - qdrant

    stdin_open: true
    tty: true


  minio:
    image: minio/minio
    container_name: health_minio
    restart: always

    command: server /data --console-address ":9001"

    env_file:
      - ../.env

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - miniodata:/data

  qdrant:
    image: qdrant/qdrant
    container_name: health_qdrant
    restart: always

    ports:
    - "6333:6333"

    volumes:
    - qdrantdata:/qdrant/storage
volumes:
  miniodata:
  qdrantdata: